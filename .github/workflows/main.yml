name: Build TetherUnlock
on:
  workflow_dispatch:
jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: repo

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang perl fakeroot git curl xz-utils ccache libssl-dev libxml2-dev

    - name: Install Theos
      run: git clone --recursive https://github.com/theos/theos.git /home/runner/theos

    - name: Install Linux toolchain
      run: |
        mkdir -p /home/runner/theos/toolchain
        cd /home/runner/theos/toolchain
        wget -q https://github.com/sbingner/llvm-project-linux/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
        tar --lzma -xf linux-ios-arm64e-clang-toolchain.tar.lzma
        mv ios-arm64e-clang-toolchain linux/iphone
        rm -f linux-ios-arm64e-clang-toolchain.tar.lzma
        ls -la linux/iphone/bin/

    - name: Download iOS SDK
      run: |
        mkdir -p /home/runner/theos/sdks
        cd /home/runner/theos/sdks
        wget -q https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
        tar -xzf master.tar.gz
        mv sdks-master/* .
        rm -rf sdks-master master.tar.gz
        ls -la

    - name: Build package
      run: |
        export THEOS=/home/runner/theos
        export PATH=$THEOS/bin:$PATH
        cd repo
        ls -la
        make package FINALPACKAGE=1 || make package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetherUnlock-deb
        path: "**/*.deb"
        if-no-files-found: error