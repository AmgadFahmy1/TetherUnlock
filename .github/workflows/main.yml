name: Build TetherUnlock
on:
  workflow_dispatch:
jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: repo

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential perl fakeroot git curl xz-utils libssl-dev libxml2-dev libtinfo6

    - name: Install Theos
      run: git clone --recursive https://github.com/theos/theos.git /home/runner/theos

    - name: Install Linux toolchain
      run: |
        mkdir -p /home/runner/theos/toolchain
        curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C /home/runner/theos/toolchain/
        ls -la /home/runner/theos/toolchain/linux/iphone/bin/

    - name: Download iOS SDK
      run: |
        mkdir -p /home/runner/theos/sdks
        cd /home/runner/theos/sdks
        wget -q https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
        tar -xzf master.tar.gz
        mv sdks-master/* .
        rm -rf sdks-master master.tar.gz
        ls -la

    - name: Build package
      run: |
        export THEOS=/home/runner/theos
        export PATH=$THEOS/bin:$PATH
        cd repo
        ls -la
        make package FINALPACKAGE=1 || make package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetherUnlock-deb
        path: "**/*.deb"
        if-no-files-found: error

  build-deb-arm64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: repo

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential perl fakeroot git curl xz-utils libssl-dev libxml2-dev libtinfo6

    - name: Install Theos
      run: git clone --recursive https://github.com/theos/theos.git /home/runner/theos

    - name: Install Linux toolchain
      run: |
        mkdir -p /home/runner/theos/toolchain
        curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C /home/runner/theos/toolchain/
        ls -la /home/runner/theos/toolchain/linux/iphone/bin/

    - name: Download iOS SDK
      run: |
        mkdir -p /home/runner/theos/sdks
        cd /home/runner/theos/sdks
        wget -q https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
        tar -xzf master.tar.gz
        mv sdks-master/* .
        rm -rf sdks-master master.tar.gz
        ls -la

    - name: Build package (arm64 only)
      run: |
        export THEOS=/home/runner/theos
        export PATH=$THEOS/bin:$PATH
        cd repo
        ls -la
        make package FINALPACKAGE=1 ARCHS=arm64

    - name: Rename artifact
      run: |
        cd repo
        for f in packages/*.deb; do
          mv "$f" "${f%.deb}-arm64.deb"
        done
        ls -la packages/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetherUnlock-deb-arm64
        path: "**/*.deb"
        if-no-files-found: error

  build-ipa:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: repo

    - name: Build app
      run: |
        cd repo/companion
        xcodebuild -project TetherUnlockApp.xcodeproj \
          -target TetherUnlockApp \
          -configuration Release \
          -sdk iphoneos \
          SYMROOT=build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build

    - name: Package IPA/TIPA
      run: |
        cd repo/companion
        APP=$(find build -name "TetherUnlockApp.app" -type d | head -1)
        echo "Found app: $APP"
        ls -la "$APP"
        mkdir -p Payload
        cp -R "$APP" Payload/
        /usr/bin/codesign --force --deep --sign - Payload/TetherUnlockApp.app || true
        zip -qry TetherUnlock.ipa Payload
        cp TetherUnlock.ipa TetherUnlock.tipa
        rm -rf Payload
        ls -la *.ipa *.tipa

    - name: Upload artifact (IPA)
      uses: actions/upload-artifact@v4
      with:
        name: TetherUnlock-ipa
        path: repo/companion/TetherUnlock.ipa
        if-no-files-found: error

    - name: Upload artifact (TIPA)
      uses: actions/upload-artifact@v4
      with:
        name: TetherUnlock-tipa
        path: repo/companion/TetherUnlock.tipa
        if-no-files-found: error
  release:
    needs: [build-deb, build-deb-arm64, build-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Collect files
      run: |
        mkdir -p release
        find artifacts -name "*.deb" -exec cp {} release/ \;
        find artifacts -name "*.ipa" -exec cp {} release/ \;
        find artifacts -name "*.tipa" -exec cp {} release/ \;
        mv release/com.tetherunlock.tweak_1.0.0_iphoneos-arm64-arm64.deb release/TetherUnlock-arm64.deb || true
        mv release/com.tetherunlock.tweak_1.0.0_iphoneos-arm64.deb release/TetherUnlock-arm64e.deb || true
        ls -la release/

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: TetherUnlock v1.0.0
        body: |
          TetherUnlock v1.0.0 — tethering unlock for iPadOS 15.0–15.4.1 (Xina15 rootless).

          **Packages**
          - `TetherUnlock-arm64.deb` — arm64-only (safest, recommended to try first)
          - `TetherUnlock-arm64e.deb` — arm64 + arm64e
          - `TetherUnlock.tipa` — companion app for TrollStore/Sideloadly
          - `TetherUnlock.ipa` — same app

          **Native mode:** Settings → TetherUnlock → "Enable Native Tethering" (TetherMe-style Netrb/MIS toggle).
        files: |
          release/*
        make_latest: true
